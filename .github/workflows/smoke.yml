name: smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run offline smoke test (no network, no quota)
        run: node test/smoke.mjs
